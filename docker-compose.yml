version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: smart-budget-postgres
    environment:
      POSTGRES_DB: smart_budget
      POSTGRES_USER: smartbudget_user
      POSTGRES_PASSWORD: SmartBudget2024!Secure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbudget_user -d smart_budget"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-budget-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
