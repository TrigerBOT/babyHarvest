services:
  postgres:
    image: postgres:15
    container_name: smart-budget-postgres
    environment:
      POSTGRES_DB: smart_budget
      POSTGRES_USER: smartbudget_user
      POSTGRES_PASSWORD: SmartBudget2024!Secure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbudget_user -d smart_budget"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-budget-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baby-harvest-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://smartbudget_user:SmartBudget2024!Secure@postgres:5432/smart_budget
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "sleep 5 && npm run build && npm run migration:run && npm run start:dev"

volumes:
  postgres_data:
  redis_data:
